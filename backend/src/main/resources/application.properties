# Server Configuration
server.address=0.0.0.0
server.port=8080

# Database Connection (Supabase PostgreSQL)
spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:6543/postgres?sslmode=require&preparedStatementCacheQueries=0
spring.datasource.username=postgres.atlxlghgfzscgyrlbzhd
